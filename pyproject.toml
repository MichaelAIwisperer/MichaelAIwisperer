[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-trader"
version = "0.1.0"
description = "Coinbase Advanced Trade SDK-based trading scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "coinbase-advanced-py==1.8.2",
  "python-dotenv==1.1.1",
  "pydantic==2.9.2"
]

[project.scripts]
cb = "cb_trader.cli:main"
